[project]
name = "foreman"
version = "0.1.0"
description = "Plateforme de foreman d'infrastructure assistée par un agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.32",
  "structlog>=24.4",
  "pyyaml>=6.0.3",
  "jsonschema>=4.26.0",
  "sqlalchemy[asyncio]>=2.1.5",
  "alembic>=1.20.0",
  "psycopg[binary]>=3.3.6",
  "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "import-linter>=2.1",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "types-jsonschema>=4.26.0.20261006",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreman"]
# Les définitions d'outils (YAML) voyagent avec le code : sans cela elles manquent dans l'image.
include = ["src/foreman/**/*.py", "src/foreman/**/*.yaml"]

[project.scripts]
foreman = "foreman.surfaces.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["foreman"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["evals: scénarios avec le vrai modèle (non déterministes, payants)"]

# --- Couches (voir docs/ARCHITECTURE.md) -------------------------------------
[tool.importlinter]
root_package = "foreman"

[[tool.importlinter.contracts]]
name = "Couches : dépendances vers le bas uniquement"
type = "layers"
layers = [
  "foreman.surfaces",
  "foreman.bootstrap",
  "foreman.tools | foreman.integrations",
  "foreman.infra",
  "foreman.core",
  "foreman.config",
]

[[tool.importlinter.contracts]]
name = "Les surfaces passent par bootstrap, jamais par tools/integrations/infra"
type = "forbidden"
source_modules = ["foreman.surfaces"]
forbidden_modules = ["foreman.tools", "foreman.integrations", "foreman.infra"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "web et cli sont indépendants"
type = "independence"
modules = ["foreman.surfaces.web", "foreman.surfaces.cli"]

[[tool.importlinter.contracts]]
name = "Les connecteurs sont indépendants (un fake n'importe jamais un autre adaptateur)"
type = "independence"
modules = [
  "foreman.integrations.gitlab",
  "foreman.integrations.server",
  "foreman.integrations.dns",
]

[[tool.importlinter.contracts]]
name = "config est une feuille"
type = "forbidden"
source_modules = ["foreman.config"]
forbidden_modules = [
  "foreman.core", "foreman.infra", "foreman.tools",
  "foreman.integrations", "foreman.bootstrap", "foreman.surfaces",
]
