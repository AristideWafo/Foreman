tool: gitlab.list_branches
version: 1.0.0
class: read
reversibility: not_applicable
connector: gitlab
description: "Liste les branches d'un projet GitLab, 20 par page."
input:
  type: object
  required: [project_id]
  properties:
    project_id: {type: integer, minimum: 1}
    search: {type: string, minLength: 1, maxLength: 100}
    page: {type: integer, minimum: 1, maximum: 10}
  additionalProperties: false
output:
  branches:
    - {name: string, default: boolean, protected: boolean, commit_short_id: string}
  next_page: integer
scope: {kind: read}
redact: []
timeout_s: 15
