tool: gitlab.list_groups
version: 1.0.0
class: read
reversibility: not_applicable
connector: gitlab
description: "Liste les groupes GitLab (sous un groupe parent, ou ceux de la plateforme), 20 par page."
input:
  type: object
  properties:
    parent_group_id: {type: integer, minimum: 1}
    search: {type: string, minLength: 1, maxLength: 100}
    page: {type: integer, minimum: 1, maximum: 10}
  additionalProperties: false
output:
  groups:
    - {id: integer, name: string, full_path: string, web_url: string}
  next_page: integer
scope: {kind: read}
redact: []
timeout_s: 15
