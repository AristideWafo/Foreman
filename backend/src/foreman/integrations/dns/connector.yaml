connector: dns
version: 1
availability: soon  # simulé : l'onglet Intégrations affiche « Bientôt disponible »
# Scopes SIMULÉS (faux DNS, lecture seule : le wildcard est géré en externe).
tokens:
  read:
    label: "Lecture : lister les enregistrements"
    scopes: [simulated.read]
tools_enabled_when:
  dns.list_records: [read]
probes:
  - {name: lire_enregistrements, token: read, call: "GET /simulated/records"}
strip_from_results: []
