tool: server.healthcheck
version: 1.0.0
class: read
reversibility: not_applicable
connector: server
input:
  type: object
  required: [environment, project]
  properties:
    environment: {enum: [staging]}
    project:     {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,40}$"}
  additionalProperties: false
output: {status: {enum: [ok, failed]}, http_status: integer, database: string}
scope: {kind: read}
redact: []
timeout_s: 15
