name: Deploy

# Staging : automatique après un Build réussi sur main.
# Production (et retour arrière) : manuel, derrière un environnement GitHub à relecteurs obligatoires.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [staging, production]
        required: true
      sha:
        description: SHA complet du commit dont l'image est à déployer (retour arrière inclus)
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Déploiement
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: Nom d'image en minuscules (GHCR refuse les majuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Valide le SHA
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA invalide" >&2; exit 1; }'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Résout le digest de l'image (on déploie le digest, on ne reconstruit pas)
        id: image
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${SHA}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest introuvable" >&2; exit 1; }
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Prépare SSH (clé limitée à deploy.sh, hôte vérifié)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déploie
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy ${IMAGE_REF}"
