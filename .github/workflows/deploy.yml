name: Deploy

# Déploiement automatique vers l'environnement GitHub « env-perso » après un Build réussi sur prod
# (c'est-à-dire au merge). Un déclenchement manuel permet de redéployer ou revenir en arrière sur un SHA.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [prod]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA complet du commit dont l'image est à déployer (retour arrière inclus)
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-env-perso
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Déploiement env-perso
    # Automatique : seulement pour un Build réussi déclenché par un push (ni PR, ni tag).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: env-perso
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT || 'foreman' }}
    steps:
      - name: Nom d'image en minuscules (GHCR refuse les majuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Valide les entrées
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA invalide" >&2; exit 1; }
          [[ "$DEPLOY_PROJECT" =~ ^[a-z0-9][a-z0-9-]{1,40}$ ]] || { echo "DEPLOY_PROJECT invalide" >&2; exit 1; }
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" ]] || { echo "variables DEPLOY_HOST et DEPLOY_USER requises dans l'environnement env-perso" >&2; exit 1; }

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Résout le digest de l'image (on déploie le digest, on ne reconstruit pas)
        id: image
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${SHA}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest introuvable" >&2; exit 1; }
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Prépare SSH (clé limitée à deploy-custom.sh, hôte vérifié)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déploie
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy ${DEPLOY_PROJECT} ${IMAGE_REF}"
