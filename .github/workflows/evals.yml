name: Evals

# Non déterministe et payant : jamais requis sur une PR.
on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: evals
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Scénarios avec le vrai modèle
        env:
          FOREMAN_EVAL_BUDGET_USD: "5"
        run: uv run pytest tests/evals -m evals || test $? -eq 5 # 5 = aucun test collecté pour l'instant
