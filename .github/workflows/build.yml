name: Build

on:
  push:
    branches: [prod]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Image (build une seule fois, scan, signature)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # signature Cosign keyless
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Nom d'image en minuscules (GHCR refuse les majuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags (SHA toujours, semver sur les tags ; jamais latest)
        id: tags
        run: |
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then tags="${tags},${IMAGE}:${GITHUB_REF_NAME#v}"; fi
          echo "list=${tags}" >> "$GITHUB_OUTPUT"

      - name: Version (manifeste release-please)
        id: version
        run: |
          version="$(jq -r '.["."]' .release-please-manifest.json)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version invalide dans le manifeste : ${version}" >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Build et push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Scan Trivy (bloquant sur HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Faux positif : des docstrings du SDK anthropic ressemblent à une clé de compte de service Google.
          # Seul le code source du paquet est exclu ; ses vulnérabilités connues restent lues dans son dist-info.
          skip-dirs: /app/.venv/lib/python3.12/site-packages/anthropic
          exit-code: "1"

      - name: Installe Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Signe l'image (par digest)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
