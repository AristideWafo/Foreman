# Réponses enregistrées du modèle pour le scénario S1 (valeurs fictives).
# Le choix se fait sur le sha256 du dernier message, jamais sur une regex.
# Les identifiants de groupe (2000, 2001, 2002) sont ceux que produit SimulatedGitLab dans l'ordre.
version: 1
exchanges:
  - when: {default: true}
    reply:
      text: "Voici le plan pour Safe Eat : la structure GitLab, puis la préparation et le déploiement en staging. Rien ne s'exécute avant votre validation."
      tool_calls:
        - name: propose_plan
          arguments:
            title: "Safe Eat : GitLab et déploiement en staging"
            summary: "Groupe safe-eat avec sous-groupes backend et frontend, deux dépôts depuis les boilerplates, puis préparation du serveur et déploiement Compose en staging."
            environment: staging
            stack: {backend: go-api, frontend: vue-web}
            skills: [gitlab-project-creation, go-backend-standard, docker-staging-deploy]
            steps:
              - title: "Créer le groupe safe-eat"
                tool: gitlab.create_group
                params: {parent_group_id: 1000, name: "Safe Eat", path: safe-eat}
              - title: "Créer le sous-groupe backend"
                tool: gitlab.create_group
                params: {parent_group_id: 2000, name: Backend, path: backend}
              - title: "Créer le sous-groupe frontend"
                tool: gitlab.create_group
                params: {parent_group_id: 2000, name: Frontend, path: frontend}
              - title: "Créer le dépôt safe-eat-api"
                tool: gitlab.create_project
                params: {parent_group_id: 2001, name: safe-eat-api, path: safe-eat-api, boilerplate: go-api}
              - title: "Créer le dépôt safe-eat-web"
                tool: gitlab.create_project
                params: {parent_group_id: 2002, name: safe-eat-web, path: safe-eat-web, boilerplate: vue-web}
              - title: "Préparer le serveur de staging"
                tool: server.apply_playbook
                params: {environment: staging, project: safe-eat, playbook: bootstrap_project, mode: apply}
              - title: "Déployer avec Docker Compose"
                tool: server.apply_playbook
                params: {environment: staging, project: safe-eat, playbook: deploy_compose, mode: apply}
