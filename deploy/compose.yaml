# Exécuté sur le serveur contrôleur. FOREMAN_IMAGE est un digest : image@sha256:...
services:
  app:
    image: ${FOREMAN_IMAGE:?FOREMAN_IMAGE requis (image@sha256:...)}
    restart: unless-stopped
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8000"]
    volumes:
      - foreman_secrets:/var/lib/foreman/secrets  # clé maître des secrets : à sauvegarder à part
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data:
  foreman_secrets:
